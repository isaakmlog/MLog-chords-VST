name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
      - name: Build
        run: cmake --build build --config Release --target MLOGChordLab_VST3
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MLOG-Chord-Lab-Windows-VST3
          path: build/MLOGChordLab_artefacts/Release/VST3/MLOG Chord Lab.vst3
